<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arc Find a Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0 16px;background:transparent}</style>
</head>
<body>
<!-- Arc Find a Club v3 -->
<style>
.af{--b:1px solid #0C1E24;position:relative;max-width:820px;margin:48px auto 32px;color:#0C1E24}.af *{box-sizing:border-box;color:inherit;font-family:gotham,Montserrat,Arial,sans-serif;letter-spacing:normal}.af-in,.af-se select{width:100%;padding:14px 18px;font-size:18px;font-weight:700;background:#fff;border:var(--b);border-radius:14px;outline:0;appearance:none}.af-in:focus,.af-se select:focus{border-color:#7AC143;box-shadow:0 0 0 3px #E4F3D9}
.af-f{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin:12px 0}.af-se{position:relative}.af-se select{padding-right:40px}.af-se:after{content:"\25BE";position:absolute;right:16px;top:13px;font-size:18px;pointer-events:none}.af-ch{display:flex;flex-wrap:wrap;gap:8px}
.af-k,.af-p{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-radius:20px;cursor:pointer}.af-k{padding:9px 14px;border:var(--b);background:#fff}.af-k:hover,.af-s a:hover{background:#E4F3D9}.af-s .af-j{background:#0C1E24;color:#fff}.af-s .af-j:hover{background:#7AC143;color:#0C1E24}.af-k.on{background:#7AC143}.af-k.af-dk{background:#0C1E24;color:#fff}
.af-n,.af-e{font-size:16px;color:#3D4B50}.af-n{margin:16px 0 12px}.af-e{position:relative;grid-column:1/-1;background:#F7F4E7;border-radius:20px;padding:20px 90px 20px 20px;line-height:1.4}.af-e,.af-c{animation:af-a .4s backwards}@keyframes af-a{from{opacity:0;transform:translateY(10px)}}
.af-l{list-style:none;margin:0;padding:0;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}.af-c{position:relative;display:flex;flex-direction:column;background:#fff;border:var(--b);border-radius:24px;overflow:hidden}.af-c:hover{transform:translateY(-4px);box-shadow:0 0 0 4px #CAE6B4}
.af-im{display:flex;justify-content:center;padding:22px;background:#F7F4E7}.af-c:hover .af-im{background:#E4F3D9}.af-lo{position:relative;width:96px;height:96px;border-radius:50%;border:var(--b);background:#fff;overflow:hidden;display:grid;place-items:center;font:700 30px gothamCondensed,Montserrat,"Arial Narrow",sans-serif}
.af-lo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}.af-b{flex:1;display:flex;flex-direction:column;gap:12px;padding:16px 18px 18px}.af-t{font-size:17px;font-weight:700;line-height:1.3;text-decoration:none}.af-t:after{content:"";position:absolute;inset:0}
.af-s{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}.af-s a{font-size:13px;font-weight:700;text-decoration:none;padding:4px 10px;border:var(--b);border-radius:20px}.af-p{align-self:flex-start;padding:5px 12px;background:#7AC143;cursor:auto}.af-x{display:block;margin:20px auto 0}.af-x[hidden]{display:none}
.af-sk{position:absolute;z-index:1;pointer-events:none;width:84px;top:-40px;right:8px;transform:rotate(9deg)}.af-e .af-sk{width:52px;top:-22px;right:-10px}.af-k,.af-c,.af-im,.af-s a,.af-in,.af-se select{transition:.3s}@media (max-width:640px){.af-f{grid-template-columns:1fr}.af-sk{width:64px;top:-32px}}
</style>
<div class="af">
<input class="af-in" id="af-q" type="search" placeholder="Search Clubs" oninput="afR(1)">
<div class="af-f">
<div class="af-se"><select id="af-cat" onchange="afL()"><option value="">All Club categories</option></select></div>
<div class="af-se"><select id="af-o" onchange="afR(1)"><option value="0">A to Z</option><option value="1">Z to A</option><option value="2">Most events</option></select></div>
</div>
<div class="af-ch" id="af-w"></div>
<p class="af-n" id="af-n">Loading Clubs...</p>
<ul class="af-l" id="af-l"></ul>
<button class="af-k af-dk af-x" id="af-x" onclick="afS+=24;afR()" hidden>Show more Clubs</button>
</div>
<script>
var afC,afV={},afS=24,afW=0;
var afSk=f=>'<img class="af-sk" alt="" src="https://cdn.sanity.io/images/n0r2xokl/production/'+f+'.png?w=200" onerror="this.remove()">';
var afG=i=>document.getElementById('af-'+i);
var afH=t=>String(t||'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt()+';');
var afK=s=>String(s).toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').trim();
var afU=u=>afH(/^http/.test(u)?u:'https://'+u);
var afF=d=>fetch('https://api.hellorubric.com',{method:'POST',body:new URLSearchParams({details:JSON.stringify(Object.assign({firstCall:true,sortType:'date',limit:1000,offset:0,sortDirection:'asc',selectedUniversityId:5},d)),endpoint:'getUnifiedSearch'})}).then(r=>r.json());
afF({desiredType:'events',showEventsFilter:'club'}).then(j=>{var t=Date.now()/1e3-864e2;(j.results||[]).forEach(e=>{if(e.sortindex>t)afV[e.societyid]=(afV[e.societyid]||0)+1});afR()}).catch(e=>0);
function afL(){
afG('n').textContent='Loading...';
var c=afG('cat').value,d={desiredType:'societies'};if(c)d.filterClubType=c;
afF(d).then(j=>{
if(!j.success)throw Error(j.error||'no data');
if(afG('cat').length<2)(j.society_club_types||[]).forEach(v=>afG('cat').add(new Option(v,v)));
afC=(j.results||[]).filter(c=>!c.isUnionItem).map(c=>(c.k=afK(c.title),c));
afR(1)}).catch(e=>afG('n').textContent='Could not load Clubs ('+e.message+')')}
function afR(reset){
if(!afC)return;if(reset)afS=24;
var q=afK(afG('q').value),o=afG('o').value,h='',i,c,v,a=afC.filter(c=>(!q||q.split(' ').every(w=>c.k.indexOf(w)>=0)||c.k.replace(/ /g,'').indexOf(q.replace(/ /g,''))>=0)&&(afW!=1||afV[c.societyid])&&(afW!=2||c.instagramurl)&&(afW!=3||c.discordurl));
a.sort((x,y)=>o==2&&(afV[y.societyid]||0)-(afV[x.societyid]||0)||(o==1?-1:1)*x.title.localeCompare(y.title));
for(i=0;i<a.length&&i<afS;i++){c=a[i];v=afV[c.societyid];
h+='<li class="af-c" style="animation-delay:'+i%24*30+'ms"><span class="af-im"><span class="af-lo">'+c.title.replace(/UNSW|The |[^A-Z]/g,'').slice(0,2)+(/default/.test(c.image)?'':'<img alt="" src="'+afH(c.image)+'" onerror="this.remove()">')+'</span></span><span class="af-b"><a class="af-t" href="https://campus.hellorubric.com'+afH(c.destination)+'" target="_blank">'+afH(c.title)+'</a>'+(v?'<span class="af-p">'+v+' event'+(v>1?'s':'')+' coming up</span>':'')+'<span class="af-s"><a class="af-j" href="https://campus.hellorubric.com'+afH(c.destination)+'" target="_blank">Join Here</a>'+(c.instagramurl?'<a href="'+afU(c.instagramurl)+'" target="_blank">Instagram</a>':'')+(c.facebookurl?'<a href="'+afU(c.facebookurl)+'" target="_blank">Facebook</a>':'')+(c.discordurl?'<a href="'+afU(c.discordurl)+'" target="_blank">Discord</a>':'')+'</span></span></li>'}
afG('l').innerHTML=a.length?h:'<li class="af-e">'+afSk('5179e5331b5fbeb0dde27f899644417e241cbf48-318x318')+'<b>No Clubs match that.</b><br>Try one distinctive word, or clear a filter. Can\'t find your thing? You can start a new Club 💚</li>';
afG('n').innerHTML='<b>'+a.length+'</b> Club'+(a.length==1?'':'s');
afG('x').hidden=a.length<=afS;
h='';['All Clubs','Upcoming events','On Instagram','On Discord'].forEach((n,i)=>h+='<button class="af-k'+(afW==i?' on':'')+'" onclick="afW='+i+';afR(1)">'+n+'</button>');afG('w').innerHTML=h}
afL();document.querySelector('.af').insertAdjacentHTML('afterbegin',afSk('dfc74f85eb526ac6f3165564dd8535c6714ec682-854x855'))
</script>
<script>
/* Auto-height: sends the Rubric iframe message the Arc site's Rubric Embed module already listens for */
(function(){var el=document.querySelector('.ae,.af'),last=0;function send(){var h=Math.ceil(el.getBoundingClientRect().bottom+scrollY)+40;if(h!==last){last=h;[location.href,location.href.replace(/\/$/,'')].forEach(function(u){parent.postMessage({type:'resize-iframe',height:h,iframe_src:u},'*')})}}new ResizeObserver(send).observe(el);addEventListener('load',send);send()})();
</script>
</body>
</html>
