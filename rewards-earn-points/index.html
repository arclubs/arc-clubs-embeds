<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arc Rewards: Earn Points</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--k:#0C1E24;--g:#7AC143;--g20:#E4F3D9;--g40:#CAE6B4;--egg:#F7F4E7;--m:#3D4B50;--r:#9EA5A7}
html,body{margin:0;padding:0 16px;background:transparent}
.rw{position:relative;max-width:820px;margin:48px auto 32px;color:var(--k)}
.rw *{box-sizing:border-box;font-family:gotham,Montserrat,Arial,sans-serif;letter-spacing:normal;color:inherit}
.rw-ch{display:flex;flex-wrap:wrap;gap:8px}
.rw-k{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:9px 14px;border:1px solid var(--k);border-radius:20px;background:#fff;cursor:pointer;transition:.3s}
.rw-k:hover{background:var(--g20)}
.rw-k.on{background:var(--g)}
.rw-k.dk{background:var(--k);color:#fff}
.rw-k.dk:hover{background:var(--g);color:var(--k)}
.rw-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.rw-tabs .rw-k{font-size:15px;padding:11px 18px}
.rw-n{font-size:16px;color:var(--m);margin:16px 0 12px}
.rw-card{position:relative;background:#fff;border:1px solid var(--k);border-radius:24px;padding:22px}
.rw-st{font-size:16px;color:var(--m);padding:18px 0}
.rw-in{width:100%;padding:14px 18px;font-size:18px;font-weight:700;background:#fff;border:1px solid var(--k);border-radius:14px;outline:0;appearance:none;transition:.3s}
.rw-in:focus{border-color:var(--g);box-shadow:0 0 0 3px var(--g20)}
.rw-lb{display:block;font-size:var(--font-size-base,17px);font-weight:700;margin:0 0 8px}
.rw-sk{position:absolute;z-index:1;pointer-events:none;width:84px;top:-40px;right:8px;transform:rotate(9deg)}
.rw-a{animation:rw-a .4s backwards}
@keyframes rw-a{from{opacity:0;transform:translateY(10px)}}
@media (max-width:640px){.rw-sk{width:64px;top:-32px}.rw-card{padding:18px;border-radius:20px}}

.rw-grid{list-style:none;margin:0;padding:0;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.rw-act{display:flex;flex-direction:column;gap:10px;height:100%;transition:.3s}
.rw-act:hover{transform:translateY(-4px);box-shadow:0 0 0 4px var(--g40)}
.rw-pt{align-self:flex-start;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:5px 12px;border-radius:20px;background:var(--g)}
.rw-pt.tbc{background:var(--egg)}
.rw-t{font-size:17px;font-weight:700;line-height:1.3;margin:0}
.rw-c{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--m)}
.rw-d{font-size:16px;line-height:1.4;color:var(--m);margin:0}
.rw-cats{margin:0 0 4px}
.rw-cats .rw-k{font-size:13px;padding:7px 12px}

</style>
</head>
<body>
<div class="rw">
<div class="rw-tabs" id="rw-aud"></div>
<div class="rw-ch rw-cats" id="rw-cat"></div>
<p class="rw-n" id="rw-n">Loading activities...</p>
<ul class="rw-grid" id="rw-l"></ul>
</div>
<script>
var URL_ACT='https://script.google.com/macros/s/AKfycbxw5I2LqnTav7vQd7m3BaDemxaUfWGKYBDT-G9PUOKWMtwfnDHQ1gYCo8Rzp1XYqsl8/exec';
var AUD=[['Clubs','Clubs'],['Execs','Execs'],['Vollies','Volunteers']];
var acts=[],aud='Clubs',cat='All';
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return'&#'+c.charCodeAt(0)+';'})}
function G(i){return document.getElementById(i)}
fetch(URL_ACT).then(function(r){return r.json()}).then(function(d){
  if(!Array.isArray(d))throw Error(d&&d.error||'unexpected data');
  /* skip blank rows, #REF! errors and rows with no audience */
  acts=d.filter(function(a){return a&&a.activity&&AUD.some(function(x){return x[0]===a.audience})&&String(a.activity).indexOf('#REF')<0});
  render();
}).catch(function(e){G('rw-n').textContent='Could not load activities ('+e.message+'). Please refresh.'});
function setAud(a){aud=a;cat='All';render()}
function setCat(c){cat=c;render()}
function render(){
  var h='';AUD.forEach(function(x){h+='<button class="rw-k'+(aud===x[0]?' dk':'')+'" onclick="setAud(\''+x[0]+'\')">'+x[1]+'</button>'});G('rw-aud').innerHTML=h;
  var mine=acts.filter(function(a){return a.audience===aud}),cats=['All'];
  mine.forEach(function(a){if(a.category&&cats.indexOf(a.category)<0)cats.push(a.category)});
  h='';cats.forEach(function(c,i){h+='<button class="rw-k'+(cat===c?' on':'')+'" onclick="setCat(cats['+i+'])">'+esc(c)+'</button>'});
  window.cats=cats;G('rw-cat').innerHTML=h;
  var list=mine.filter(function(a){return cat==='All'||a.category===cat});
  G('rw-n').innerHTML='<b>'+list.length+'</b> activit'+(list.length===1?'y':'ies');
  h='';list.forEach(function(a,i){var n=Number(a.points),ok=a.points!==''&&a.points!=null&&!isNaN(n);
    h+='<li class="rw-card rw-act rw-a" style="animation-delay:'+(i%24)*30+'ms"><span class="rw-pt'+(ok?'':' tbc')+'">'+(ok?'+'+n+' points':esc(a.points||'TBC'))+'</span><p class="rw-t">'+esc(a.activity)+'</p>'+(a.category?'<span class="rw-c">'+esc(a.category)+'</span>':'')+(a.howToEarn?'<p class="rw-d">'+esc(a.howToEarn)+'</p>':'')+'</li>'});
  G('rw-l').innerHTML=list.length?h:'<li class="rw-st">No activities in this category yet.</li>';
}
</script>
<script>
/* Auto-height for the Arc site's Rubric Embed module (Rubric's resize-iframe message) */
(function(){var el=document.querySelector('.rw'),last=0;function send(){var h=Math.ceil(el.getBoundingClientRect().bottom+scrollY)+40;if(h!==last){last=h;[location.href,location.href.replace(/\/$/,'')].forEach(function(u){parent.postMessage({type:'resize-iframe',height:h,iframe_src:u},'*')})}}new ResizeObserver(send).observe(el);addEventListener('load',send);send()})();
</script>
</body>
</html>
