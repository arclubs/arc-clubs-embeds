<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arc Asset Grant Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0 16px;background:transparent}</style>
</head>
<body>
<!-- Arc Asset Grant calculator. Hosted page for the Rubric Embed module (iframe), no backend. Rules: Info Sheet 5 Funding & Grants. Rate and cap are set at the top of the script. -->
<style>
.asg{--g:#7ac143;--g2:#e4f3d9;--k:#0c1e24;--m:#3d4b50;--e:#f7f4e7;--b:var(--font-size-base,17px);--s:gotham,"Gotham HTF","Gotham","Montserrat","Helvetica Neue",Arial,sans-serif;--c:gothamCondensed,"Gotham Condensed","Gotham HTF","Montserrat","Arial Narrow",sans-serif;font-family:var(--s);font-size:var(--b);color:var(--k);box-sizing:border-box;width:100%;max-width:820px;margin:40px auto 32px}
.asg *{box-sizing:border-box;font-family:inherit;letter-spacing:normal}
.asg-card{position:relative;background:#fff;border:1px solid var(--k);border-radius:40px;padding:32px}
.asg-stk{position:absolute;display:block;pointer-events:none;height:auto}
.asg-s1{width:92px;top:-38px;right:28px;transform:rotate(9deg)}
.asg-s2{width:54px;top:-26px;right:-12px}
.asg-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 24px}
.asg-f{display:block;margin:0}
.asg-l{display:block;font-size:var(--b);line-height:1.3;font-weight:700;margin:0 0 8px}
.asg-o{font-weight:400;color:var(--m)}
.asg-h{display:block;font-size:16px;line-height:1.35;font-weight:400;color:var(--m);margin:8px 0 0}
.asg-in{position:relative;display:block}
.asg-in.asg-dl::before{content:"$";position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:18px;font-weight:700;color:var(--k);pointer-events:none;z-index:1}
.asg-in.asg-sel::after{content:"";position:absolute;right:20px;top:50%;width:9px;height:9px;border-right:2px solid var(--k);border-bottom:2px solid var(--k);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.asg-i{display:block;width:100%;margin:0;padding:14px 18px;font-size:18px;line-height:1.3;font-weight:700;color:var(--k);background:#fff;border:1px solid var(--k);border-radius:14px;outline:none;appearance:none;-webkit-appearance:none;-moz-appearance:textfield;font-variant-numeric:tabular-nums}
.asg-sel .asg-i{padding-right:46px;cursor:pointer}
.asg-dl .asg-i{padding-left:34px}
.asg-i:focus{border-color:var(--g);box-shadow:0 0 0 3px var(--g2)}
.asg-i::-webkit-inner-spin-button,.asg-i::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.asg-out{margin:28px 0 0;background:var(--e);border-radius:20px;padding:26px}
.asg-msg{font-size:var(--b);line-height:1.35;font-weight:400;margin:0}
.asg-msg strong{font-weight:700}
.asg-tier{display:inline-block;font-size:14px;line-height:1.35;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:7px 14px;border-radius:20px;background:var(--k);color:#fff;margin:0 0 16px}
.asg-row{display:flex;align-items:baseline;gap:12px;padding:14px 0;border-bottom:1px dotted #9ea5a7}
.asg-row span{flex:1 1 auto;min-width:0;font-size:var(--b);line-height:1.3;font-weight:700}
.asg-row small{display:block;font-size:16px;line-height:1.35;font-weight:400;color:var(--m);margin:4px 0 0}
.asg-row em{flex:0 0 auto;white-space:nowrap;font-style:normal;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.asg-tot{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 0;padding:18px 22px;background:var(--g);border-radius:14px}
.asg-tot span{font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.asg-tot em{font-family:var(--c);font-style:normal;font-size:44px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.asg-note{font-size:14px;line-height:1.4;font-weight:400;color:var(--m);margin:16px 0 0}
.asg-note strong{font-weight:700;color:var(--k)}
@media (max-width:640px){
.asg-card{padding:22px;border-radius:24px}
.asg-grid{grid-template-columns:1fr}
.asg-out{padding:18px}
.asg-tot em{font-size:36px}
.asg-s1{width:64px;top:-30px;right:16px}
.asg-s2{width:40px;top:-20px;right:-6px}
}
</style>
<div class="asg">
<div class="asg-card">
<img class="asg-stk asg-s1" src="https://cdn.sanity.io/images/n0r2xokl/production/d709c9bbf30711e4ff4786b9e70222fff321c8bb-966x881.png?w=200" alt="" aria-hidden="true" onerror="this.remove()">
<div class="asg-grid">
<label class="asg-f"><span class="asg-l">Active Arc members</span><span class="asg-in"><input class="asg-i" id="asgM" type="number" min="0" step="1" inputmode="numeric" placeholder="e.g. 120"></span><span class="asg-h">You can find your current Active Arc Membership on your Rubric Dashboard.</span></label>
<label class="asg-f"><span class="asg-l">What did you buy?</span><span class="asg-in asg-sel"><select class="asg-i" id="asgT">
<option value="0">Equipment</option>
<option value="1">Merchandise</option>
<option value="2">Publication</option>
<option value="3">Digital subscription</option>
<option value="4">Training (RSA or First Aid)</option>
</select></span><span class="asg-h">It must support your Club's aims and not be something Arc already lends out.</span></label>
<label class="asg-f"><span class="asg-l">Purchase cost</span><span class="asg-in asg-dl"><input class="asg-i" id="asgC" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0"></span><span class="asg-h">The total on your valid receipt or invoice, including GST and delivery.</span></label>
<label class="asg-f"><span class="asg-l">Already received this year <span class="asg-o">(optional)</span></span><span class="asg-in asg-dl"><input class="asg-i" id="asgU" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0"></span><span class="asg-h">Activity and asset grants paid since 1 January.</span></label>
</div>
<div class="asg-out" id="asgOut"><p class="asg-msg">Calculator loading. If this message stays, refresh the page.</p></div>
</div>
</div>
<script>
(function(){
var RATE=0.25,MAX=600;
var EV=["A photo of the equipment with the Arc logo sticker on it. Images of the product online won't be accepted.","Design images showing the Arc logo, or a photo of the finished merch.","A digital copy of the publication, even if incomplete, with the Arc logo included.","A screenshot of the active subscription, with the Arc logo included if applicable.","A copy of the completed certificate showing the provider and the person's name."];
var $=function(i){return document.getElementById(i)},out=$("asgOut");
function n(i){var v=parseFloat($(i).value);return isFinite(v)&&v>0?v:0}
function f(v){return "$"+v.toLocaleString("en-AU",{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2})}
function row(l,s,v){return '<div class="asg-row"><span>'+l+(s?"<small>"+s+"</small>":"")+"</span><em>"+v+"</em></div>"}
function calc(){
var mv=$("asgM").value,m=n("asgM"),c=n("asgC"),u=n("asgU"),ty=+$("asgT").value,p=Math.round(RATE*100);
if(mv===""){out.innerHTML='<p class="asg-msg">Pop in your Club\'s active Arc members and what you bought to see your estimate.</p>';return}
if(m<5){out.innerHTML='<p class="asg-msg"><strong>Your Club needs at least 5 active Arc members to access asset grants.</strong> Encourage your members to sign up to your Club on Rubric with an active Arc membership, then come back.</p>';return}
var t=m>=250?["Gold",4000]:m>=75?["Silver",2500]:["Bronze",1500],ann=t[1];
var raw=c*RATE,g=Math.min(raw,MAX),rem=Math.max(0,ann-u),fin=Math.min(g,rem);
var gs=c?p+"% of "+f(c)+(g<raw?", capped at "+f(MAX)+" per purchase":""):"No purchase cost entered";
var h='<span class="asg-tier">'+t[0]+" tier · "+f(ann)+" yearly limit</span>"+row("Asset support",gs,f(g));
if(fin<g)h+=row("Yearly limit",f(ann)+" per year across activity and asset grants, "+f(rem)+" left","−"+f(g-fin));
h+='<div class="asg-tot"><img class="asg-stk asg-s2" src="https://cdn.sanity.io/images/n0r2xokl/production/4828db6d4e97846d5a4f666645c70519e34e5f5a-310x338.png?w=120" alt="" aria-hidden="true" onerror="this.remove()"><span>Estimated grant</span><em>'+f(fin)+"</em></div>";
h+='<p class="asg-note"><strong>You\'ll need:</strong> your valid receipt or invoice, plus '+EV[ty].charAt(0).toLowerCase()+EV[ty].slice(1)+"</p>";
h+='<p class="asg-note">This is an estimate only. Apply within one calendar month of your purchase or invoice date, and check with Arc Clubs first if you\'re unsure an item is eligible.</p>';
out.innerHTML=h}
["asgM","asgC","asgU"].forEach(function(i){$(i).addEventListener("input",calc)});
$("asgT").addEventListener("change",calc);
calc()})();
</script>

<script>
/* Auto-height for the Arc site's Rubric Embed module (Rubric's resize-iframe message).
   - Re-sends the height for the first 20s: the site loads Rubric's listener after the page, so early messages can be missed.
   - MutationObserver + timer as well as ResizeObserver: browsers pause ResizeObserver in cross-origin iframes
     that are off-screen or in an unfocused window. */
(function(){var el=document.querySelector('.agc,.asg,.rw,.ae,.af'),last=0,t0=Date.now();function send(force){var h=Math.ceil(el.getBoundingClientRect().bottom+scrollY)+40;if(h!==last||force===true){last=h;[location.href,location.href.replace(/\/$/,'')].forEach(function(u){parent.postMessage({type:'resize-iframe',height:h,iframe_src:u},'*')})}}
try{new ResizeObserver(send).observe(el)}catch(e){}
new MutationObserver(function(){setTimeout(send,30)}).observe(el,{childList:true,subtree:true,attributes:true,characterData:true});
addEventListener('load',send);document.addEventListener('load',send,true);setInterval(function(){send(Date.now()-t0<20000)},700);send()})();
</script>
</body>
</html>
