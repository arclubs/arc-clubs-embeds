<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arc Rewards: Check Your Points</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--k:#0C1E24;--g:#7AC143;--g20:#E4F3D9;--g40:#CAE6B4;--egg:#F7F4E7;--m:#3D4B50;--r:#9EA5A7}
html,body{margin:0;padding:0 16px;background:transparent}
.rw{position:relative;max-width:820px;margin:48px auto 32px;color:var(--k)}
.rw *{box-sizing:border-box;font-family:gotham,Montserrat,Arial,sans-serif;letter-spacing:normal;color:inherit}
.rw-ch{display:flex;flex-wrap:wrap;gap:8px}
.rw-k{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:9px 14px;border:1px solid var(--k);border-radius:20px;background:#fff;cursor:pointer;transition:.3s}
.rw-k:hover{background:var(--g20)}
.rw-k.on{background:var(--g)}
.rw-k.dk{background:var(--k);color:#fff}
.rw-k.dk:hover{background:var(--g);color:var(--k)}
.rw-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.rw-tabs .rw-k{font-size:15px;padding:11px 18px}
.rw-n{font-size:16px;color:var(--m);margin:16px 0 12px}
.rw-card{position:relative;background:#fff;border:1px solid var(--k);border-radius:24px;padding:22px}
.rw-st{font-size:16px;color:var(--m);padding:18px 0}
.rw-in{width:100%;padding:14px 18px;font-size:18px;font-weight:700;background:#fff;border:1px solid var(--k);border-radius:14px;outline:0;appearance:none;transition:.3s}
.rw-in:focus{border-color:var(--g);box-shadow:0 0 0 3px var(--g20)}
.rw-lb{display:block;font-size:var(--font-size-base,17px);font-weight:700;margin:0 0 8px}
.rw-sk{position:absolute;z-index:1;pointer-events:none;width:84px;top:-40px;right:8px;transform:rotate(9deg)}
.rw-a{animation:rw-a .4s backwards}
@keyframes rw-a{from{opacity:0;transform:translateY(10px)}}
@media (max-width:640px){.rw-sk{width:64px;top:-32px}.rw-card{padding:18px;border-radius:20px}}

.rw-two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.rw-h{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;display:inline-block;padding:5px 12px;border-radius:20px;background:var(--k);color:#fff;margin:0 0 16px}
.rw-row{display:flex;gap:10px}
.rw-row .rw-in{flex:1;min-width:0}
.rw-go{flex:0 0 auto;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:0 18px;border:0;border-radius:14px;background:var(--k);color:#fff;cursor:pointer;transition:.3s}
.rw-go:hover{background:var(--g);color:var(--k)}
.rw-hint{font-size:14px;color:var(--m);margin:8px 0 0}
.rw-res{margin-top:16px}
.rw-li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:12px 0;border-bottom:1px dotted var(--r);font-size:16px}
.rw-li b{white-space:nowrap}
.rw-tot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0 0;padding:14px 16px;background:var(--g);border-radius:14px}
.rw-tot span{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.rw-tot b{font:700 36px gothamCondensed,Montserrat,"Arial Narrow",sans-serif}
.rw-hist{margin:16px 0 0;background:var(--egg);border-radius:20px;padding:16px 18px}
.rw-hist .rw-li:last-child{border-bottom:0}
.rw-err{font-size:16px;color:var(--k);background:var(--egg);border-radius:14px;padding:14px 16px}
.rw-list{max-height:220px;overflow-y:auto;margin:10px 0 0;border:1px solid var(--k);border-radius:14px;background:#fff}
.rw-it{display:block;width:100%;text-align:left;font-size:16px;font-weight:700;padding:11px 16px;border:0;border-bottom:1px dotted var(--r);background:#fff;cursor:pointer;transition:.3s}
.rw-it:last-child{border-bottom:0}
.rw-it:hover{background:var(--g20)}.rw-it.on{background:var(--g)}
@media (max-width:640px){.rw-two{grid-template-columns:1fr}.rw-tot b{font-size:30px}}

</style>
</head>
<body>
<div class="rw">
<img class="rw-sk" alt="" aria-hidden="true" src="https://cdn.sanity.io/images/n0r2xokl/production/d709c9bbf30711e4ff4786b9e70222fff321c8bb-966x881.png?w=200" onerror="this.remove()">
<div class="rw-two">
<section class="rw-card rw-a">
<span class="rw-h">Execs &amp; Volunteers</span>
<label class="rw-lb" for="rw-z">Your zID</label>
<div class="rw-row"><input class="rw-in" id="rw-z" inputmode="numeric" autocomplete="off" placeholder="e.g. 5123456"><button class="rw-go" onclick="me()">Check</button></div>
<p class="rw-hint">7 digits, with or without the z.</p>
<div class="rw-res" id="rw-me"></div>
</section>
<section class="rw-card rw-a" style="animation-delay:80ms">
<span class="rw-h">Clubs</span>
<label class="rw-lb" for="rw-cq">Find your Club</label>
<input class="rw-in" id="rw-cq" autocomplete="off" placeholder="Start typing your Club name" oninput="findClub()">
<div class="rw-list" id="rw-cl"><p class="rw-st" style="padding:12px 16px">Loading Clubs...</p></div>
<div class="rw-res" id="rw-club"></div>
</section>
</div>
</div>
<script>
var URL_ME='https://script.google.com/macros/s/AKfycby47G2S-nlY6Lpz9zOe6eQBUBThzbY7IyfzCaQ2bEW87qyYGOxHVu4MI2bn5k_qjnuddg/exec';
var URL_CL='https://script.google.com/macros/s/AKfycby-zaJiLUrM3FEjFf3KBAMKrYlfJ3lhsx_h7K_KobaESQUeAJJDv5L04hLOFzTXq_84fw/exec';
var clubs=[],sel='';
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return'&#'+c.charCodeAt(0)+';'})}
function G(i){return document.getElementById(i)}
function key(s){return String(s).toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').trim()}
function pts(v){var n=Number(v);return isNaN(n)?esc(v):n.toLocaleString('en-AU')}
G('rw-z').addEventListener('keydown',function(e){if(e.key==='Enter')me()});
function me(){
  var z=G('rw-z').value.trim().replace(/^z/i,''),o=G('rw-me');
  if(!/^\d{7}$/.test(z)){o.innerHTML='<p class="rw-err">That doesn\'t look like a zID. Enter the 7 digits, e.g. 5123456.</p>';return}
  o.innerHTML='<p class="rw-st">Checking...</p>';
  fetch(URL_ME+'?q='+encodeURIComponent(z)).then(function(r){return r.json()}).then(function(d){
    if(d.error)throw Error(d.error);
    if(!d.results||!d.results.length){o.innerHTML='<p class="rw-err">No points found for '+esc(z)+' yet. Points land 1-2 business days after an activity, and only for Execs and Volunteers registered on Rubric. Still missing? Email <a href="mailto:clubs@arc.unsw.edu.au" target="_top">clubs@arc.unsw.edu.au</a></p>';return}
    var hd=d.headers||[],row=d.results[0];
    function col(k){var i=hd.findIndex(function(h){return String(h).toLowerCase().indexOf(k)>=0});return i>-1&&row[i]!==''&&row[i]!=null?row[i]:'-'}
    var nm=String(col('name')).split(' ')[0],h='<div class="rw-li"><span>Hi '+esc(nm)+'! Total earned</span><b>'+pts(col('total'))+' pts</b></div><div class="rw-tot"><span>Points balance</span><b>'+pts(col('balance'))+'</b></div>';
    h+='<div class="rw-hist"><span class="rw-lb">Activity history</span>';
    if(d.history&&d.history.length)d.history.forEach(function(x){h+='<div class="rw-li"><span>'+esc(x.activity||'-')+'</span><b>+'+pts(x.points||0)+'</b></div>'});
    else h+='<p class="rw-st" style="padding:4px 0">No activity recorded yet. Attend an Arc event or training to start earning!</p>';
    o.innerHTML=h+'</div>';
  }).catch(function(e){o.innerHTML='<p class="rw-err">Could not check points ('+esc(e.message)+'). Please try again.</p>'});
}
fetch(URL_CL+'?action=list').then(function(r){return r.json()}).then(function(d){if(!Array.isArray(d))throw Error(d&&d.error||'unexpected data');clubs=d.filter(Boolean).map(function(n){return{n:n,k:key(n),z:key(n).replace(/ /g,'')}});findClub()})
.catch(function(e){G('rw-cl').innerHTML='<p class="rw-st" style="padding:12px 16px">Could not load Clubs ('+esc(e.message)+').</p>'});
function findClub(){
  var q=key(G('rw-cq').value),w=q?q.split(' '):[],a=clubs.filter(function(c){return w.every(function(t){return c.k.indexOf(t)>=0})||(q&&c.z.indexOf(q.replace(/ /g,''))>=0)}),h='';
  a.forEach(function(c,i){h+='<button class="rw-it'+(c.n===sel?' on':'')+'" onclick="club('+clubs.indexOf(c)+')">'+esc(c.n)+'</button>'});
  G('rw-cl').innerHTML=h||'<p class="rw-st" style="padding:12px 16px">No Club matches that. Try one distinctive word.</p>';
}
function club(i){var c=clubs[i],o=G('rw-club');sel=c.n;findClub();o.innerHTML='<p class="rw-st">Checking...</p>';
  fetch(URL_CL+'?action=balance&club='+encodeURIComponent(c.n)).then(function(r){return r.json()}).then(function(d){if(!d||d.error)throw Error(d&&d.error||'no data');
    o.innerHTML='<div class="rw-tot"><span>Club points balance</span><b>'+pts(d.balance)+'</b></div>'})
  .catch(function(e){o.innerHTML='<p class="rw-err">Could not load the balance ('+esc(e.message)+').</p>'})}
</script>
<script>
/* Auto-height for the Arc site's Rubric Embed module (Rubric's resize-iframe message) */
(function(){var el=document.querySelector('.rw'),last=0;function send(){var h=Math.ceil(el.getBoundingClientRect().bottom+scrollY)+40;if(h!==last){last=h;[location.href,location.href.replace(/\/$/,'')].forEach(function(u){parent.postMessage({type:'resize-iframe',height:h,iframe_src:u},'*')})}}new ResizeObserver(send).observe(el);addEventListener('load',send);send()})();
</script>
</body>
</html>
