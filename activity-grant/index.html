<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arc Activity Grant Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0 16px;background:transparent}</style>
</head>
<body>
<!-- Arc Activity Grant calculator. Hosted page for the Rubric Embed module (iframe), no backend. Rules: Info Sheet 5 Funding & Grants. -->
<style>
.agc{--g:#7ac143;--g2:#e4f3d9;--k:#0c1e24;--m:#3d4b50;--e:#f7f4e7;--b:var(--font-size-base,17px);--s:gotham,"Gotham HTF","Gotham","Montserrat","Helvetica Neue",Arial,sans-serif;--c:gothamCondensed,"Gotham Condensed","Gotham HTF","Montserrat","Arial Narrow",sans-serif;font-family:var(--s);font-size:var(--b);color:var(--k);box-sizing:border-box;width:100%;max-width:820px;margin:40px auto 32px}
.agc *{box-sizing:border-box;font-family:inherit;letter-spacing:normal}
.agc-card{position:relative;background:#fff;border:1px solid var(--k);border-radius:40px;padding:32px}
.agc-stk{position:absolute;display:block;pointer-events:none;height:auto}
.agc-s1{width:92px;top:-38px;right:28px;transform:rotate(9deg)}
.agc-s2{width:54px;top:-26px;right:-12px}
.agc-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 24px}
.agc-f{display:block;margin:0}
.agc-l{display:block;font-size:var(--b);line-height:1.3;font-weight:700;margin:0 0 8px}
.agc-o{font-weight:400;color:var(--m)}
.agc-h{display:block;font-size:16px;line-height:1.35;font-weight:400;color:var(--m);margin:8px 0 0}
.agc-in{position:relative;display:block}
.agc-in.agc-dl::before{content:"$";position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:18px;font-weight:700;color:var(--k);pointer-events:none;z-index:1}
.agc-i{display:block;width:100%;margin:0;padding:14px 18px;font-size:18px;line-height:1.3;font-weight:700;color:var(--k);background:#fff;border:1px solid var(--k);border-radius:14px;outline:none;appearance:none;-moz-appearance:textfield;font-variant-numeric:tabular-nums}
.agc-dl .agc-i{padding-left:34px}
.agc-i:focus{border-color:var(--g);box-shadow:0 0 0 3px var(--g2)}
.agc-i::-webkit-inner-spin-button,.agc-i::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.agc-out{margin:28px 0 0;background:var(--e);border-radius:20px;padding:26px}
.agc-msg{font-size:var(--b);line-height:1.35;font-weight:400;margin:0}
.agc-msg strong{font-weight:700}
.agc-tier{display:inline-block;font-size:14px;line-height:1.35;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:7px 14px;border-radius:20px;background:var(--k);color:#fff;margin:0 0 16px}
.agc-row{display:flex;align-items:baseline;gap:12px;padding:14px 0;border-bottom:1px dotted #9ea5a7}
.agc-row span{flex:1 1 auto;min-width:0;font-size:var(--b);line-height:1.3;font-weight:700}
.agc-row small{display:block;font-size:16px;line-height:1.35;font-weight:400;color:var(--m);margin:4px 0 0}
.agc-row em{flex:0 0 auto;white-space:nowrap;font-style:normal;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.agc-tot{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 0;padding:18px 22px;background:var(--g);border-radius:14px}
.agc-tot span{font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.agc-tot em{font-family:var(--c);font-style:normal;font-size:44px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.agc-note{font-size:14px;line-height:1.4;font-weight:400;color:var(--m);margin:16px 0 0}
@media (max-width:640px){
.agc-card{padding:22px;border-radius:24px}
.agc-grid{grid-template-columns:1fr}
.agc-out{padding:18px}
.agc-tot em{font-size:36px}
.agc-s1{width:64px;top:-30px;right:16px}
.agc-s2{width:40px;top:-20px;right:-6px}
}
</style>
<div class="agc">
<div class="agc-card">
<img class="agc-stk agc-s1" src="https://cdn.sanity.io/images/n0r2xokl/production/d709c9bbf30711e4ff4786b9e70222fff321c8bb-966x881.png?w=200" alt="" aria-hidden="true" onerror="this.remove()">
<div class="agc-grid">
<label class="agc-f"><span class="agc-l">Active Arc members</span><span class="agc-in"><input class="agc-i" id="agcM" type="number" min="0" step="1" inputmode="numeric" placeholder="e.g. 120"></span><span class="agc-h">You can find your current Active Arc Membership on your Rubric Dashboard.</span></label>
<label class="agc-f"><span class="agc-l">Attendees</span><span class="agc-in"><input class="agc-i" id="agcA" type="number" min="0" step="1" inputmode="numeric" placeholder="e.g. 60"></span><span class="agc-h">Arc Members only.</span></label>
<label class="agc-f"><span class="agc-l">Event income</span><span class="agc-in agc-dl"><input class="agc-i" id="agcI" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0"></span><span class="agc-h">Ticket sales and sponsorship funding. Do not count income from the expected Activity Grant.</span></label>
<label class="agc-f"><span class="agc-l">Eligible expenses</span><span class="agc-in agc-dl"><input class="agc-i" id="agcE" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0"></span><span class="agc-h">Leave out alcohol (unless from the Roundhouse), transport, cash prizes and payments to members.</span></label>
<label class="agc-f"><span class="agc-l">Already received this year <span class="agc-o">(optional)</span></span><span class="agc-in agc-dl"><input class="agc-i" id="agcU" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0"></span><span class="agc-h">Activity and asset grants paid since 1 January.</span></label>
</div>
<div class="agc-out" id="agcOut"><p class="agc-msg">Calculator loading. If this message stays, refresh the page.</p></div>
</div>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)},out=$("agcOut");
function n(i){var v=parseFloat($(i).value);return isFinite(v)&&v>0?v:0}
function f(v){return "$"+v.toLocaleString("en-AU",{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2})}
function row(l,s,v){return '<div class="agc-row"><span>'+l+(s?"<small>"+s+"</small>":"")+"</span><em>"+v+"</em></div>"}
function calc(){
var mv=$("agcM").value,m=n("agcM"),a=Math.floor(n("agcA")),i=n("agcI"),e=n("agcE"),u=n("agcU");
if(mv===""){out.innerHTML='<p class="agc-msg">Pop in your Club\'s active Arc members and event numbers to see your estimate.</p>';return}
if(m<5){out.innerHTML='<p class="agc-msg"><strong>Your Club needs at least 5 active Arc members to access activity grants.</strong> Encourage your members to sign up to your Club on Rubric with an active Arc membership, then come back.</p>';return}
var t=m>=250?["Gold",1500,4000]:m>=75?["Silver",1125,2500]:["Bronze",750,1500],cap=t[1],ann=t[2];
var loss=Math.max(0,e-i),half=e*0.5,x=Math.min(half,loss),xc=Math.min(x,cap),prof=i>=e;
var res=e===0&&i===0?"No income or expenses":prof?(i>e?"Profit of "+f(i-e):"Broke even"):"Loss of "+f(loss);
var xs=e===0?"No expenses entered":prof?"Your event covered its costs, so there's nothing to top up":"50% of "+f(e)+(x<half?", limited to your "+f(loss)+" loss":"")+(xc<x?", capped at the "+t[0]+" limit of "+f(cap):"");
var rate=prof?2:1,max=prof?200:100,ac=Math.min(a,max),att=ac*rate;
var as=a?ac+" attendees × $"+rate+(a>max?" (counted up to "+max+")":"")+(prof?"":" · loss-making events get $1 each, up to 100"):"No attendees entered";
var tot=xc+att,rem=Math.max(0,ann-u),fin=Math.min(tot,rem);
var h='<span class="agc-tier">'+t[0]+" tier · "+f(cap)+" cap per application</span>"+row("Event result",res,"")+row("Expense support",xs,f(xc))+row("Attendance",as,f(att));
if(fin<tot)h+=row("Annual limit",f(ann)+" per year, "+f(rem)+" left","−"+f(tot-fin));
h+='<div class="agc-tot"><img class="agc-stk agc-s2" src="https://cdn.sanity.io/images/n0r2xokl/production/4828db6d4e97846d5a4f666645c70519e34e5f5a-310x338.png?w=120" alt="" aria-hidden="true" onerror="this.remove()"><span>Estimated grant</span><em>'+f(fin)+"</em></div>";
h+='<p class="agc-note">This is an estimate only. Your final amount depends on valid receipts, your Rubric attendance list, an event photo with the Arc logo, and applying within 30 days of your event.</p>';
out.innerHTML=h}
["agcM","agcA","agcI","agcE","agcU"].forEach(function(i){$(i).addEventListener("input",calc)});
calc()})();
</script>

<script>
/* Auto-height for the Arc site's Rubric Embed module (Rubric's resize-iframe message).
   - Re-sends the height for the first 20s: the site loads Rubric's listener after the page, so early messages can be missed.
   - MutationObserver + timer as well as ResizeObserver: browsers pause ResizeObserver in cross-origin iframes
     that are off-screen or in an unfocused window. */
(function(){var el=document.querySelector('.agc,.asg,.rw,.ae,.af'),last=0,t0=Date.now();function send(force){var h=Math.ceil(el.getBoundingClientRect().bottom+scrollY)+40;if(h!==last||force===true){last=h;[location.href,location.href.replace(/\/$/,'')].forEach(function(u){parent.postMessage({type:'resize-iframe',height:h,iframe_src:u},'*')})}}
try{new ResizeObserver(send).observe(el)}catch(e){}
new MutationObserver(function(){setTimeout(send,30)}).observe(el,{childList:true,subtree:true,attributes:true,characterData:true});
addEventListener('load',send);document.addEventListener('load',send,true);setInterval(function(){send(Date.now()-t0<20000)},700);send()})();
</script>
</body>
</html>
